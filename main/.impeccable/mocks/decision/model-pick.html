<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gothic+A1:wght@500;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;font-family:"Gothic A1",sans-serif;background:#F1F1EE;color:#111}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px}
.top b{font-family:"Do Hyeon";font-size:28px}
.top span{font-size:12px;font-weight:700;background:#111;color:#fff;padding:4px 8px}
.ask{margin:0 16px;display:flex;background:#fff;border:2px solid #111}
.ask p{flex:1;padding:12px;font-size:15px;font-weight:700}
.ask i{font-style:normal;background:#E5322D;color:#fff;font-weight:900;padding:12px 14px}
.map{position:relative;height:300px;margin:12px 0 0;background:#DCDCD6}
.map svg{position:absolute;inset:0}
.bib{position:relative;margin:-36px 16px 0;background:#fff;border:2px solid #111;padding:12px 14px 10px}
.bib::before,.bib::after{content:"";position:absolute;top:8px;width:9px;height:9px;border-radius:50%;border:2px solid #111;background:#F1F1EE}
.bib::before{left:8px}.bib::after{right:8px}
.band{display:flex;justify-content:space-between;background:#E5322D;color:#fff;font-weight:900;font-size:12px;padding:4px 8px;margin:6px 0 4px}
.big{display:flex;align-items:flex-end;gap:12px}
.big b{font-family:"Bebas Neue";font-size:96px;line-height:.85}
.big span{font-family:"Do Hyeon";font-size:22px;line-height:1.2;padding-bottom:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid #111;margin-top:8px}
.stats div{padding:6px 0;text-align:center;border-right:1px solid #111}.stats div:last-child{border:0}
.stats em{font-style:normal;font-family:"Bebas Neue";font-size:26px;display:block;line-height:1}
.stats small{font-size:11px;font-weight:700}
.marks{display:flex;justify-content:space-between;margin:14px 16px 8px}
.mk{width:44px;height:30px;background:#FFD400;border:2px solid #111;display:grid;place-items:center;font-family:"Bebas Neue";font-size:20px}
.mk.s{background:#111;color:#fff}
.alt{margin:6px 16px;display:flex;justify-content:space-between;padding:10px 0;border-bottom:2px solid #111;font-weight:800;font-size:14px}
.alt em{font-style:normal;font-family:"Bebas Neue";font-size:24px}
</style></head><body>
<div class="top"><b>orca</b><span>2026 국제캠 러닝</span></div>
<div class="ask"><p>공강 30분인데 오르막 싫어, 정문에서</p><i>찾기</i></div>
<div class="map"><svg viewBox="0 0 390 300">
 <g stroke="#fff" stroke-width="8" fill="none"><path d="M0 220 L390 190"/><path d="M110 0 L160 300"/><path d="M270 0 L300 300"/></g>
 <path d="M260 230 L290 170 C300 130 290 95 260 80 C220 62 180 72 160 100 C140 140 150 190 180 215 C210 238 240 242 260 230" stroke="#E5322D" stroke-width="9" fill="none" stroke-linecap="round"/>
 <g font-family="Bebas Neue" font-size="16" text-anchor="middle"><rect x="282" y="138" width="24" height="20" fill="#FFD400" stroke="#111" stroke-width="2"/><text x="294" y="154">1</text>
 <rect x="208" y="58" width="24" height="20" fill="#FFD400" stroke="#111" stroke-width="2"/><text x="220" y="74">2</text>
 <rect x="138" y="150" width="24" height="20" fill="#FFD400" stroke="#111" stroke-width="2"/><text x="150" y="166">3</text></g>
 <circle cx="260" cy="230" r="10" fill="#111"/></svg></div>
<div class="bib">
 <div class="band"><span>A선 · 경희대 정문 순환</span><span>평지 위주</span></div>
 <div class="big"><b>4.83</b><span>km<br>34분 예상</span></div>
 <div class="stats"><div><em>2</em><small>신호 건널목</small></div><div><em>63m</em><small>누적 상승</small></div><div><em>4분</em><small>공강 초과</small></div></div>
</div>
<div class="marks"><span class="mk s">출발</span><span class="mk">1</span><span class="mk">2</span><span class="mk">3</span><span class="mk">4</span><span class="mk s">도착</span></div>
<div class="alt"><span>B선 · 37분 · 신호 3곳</span><em>5.28</em></div>
<div class="alt"><span>C선 · 36분 · 신호 1곳</span><em>5.09</em></div>
</body></html>
