<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden}
body{font-family:"Gothic A1",sans-serif;background:#0E1B3D;color:#F4F1E8}
.head{padding:16px;display:flex;align-items:baseline;gap:10px}
.head b{font-size:22px;font-weight:900}
.head small{font-size:12px;opacity:.7}
.ask{margin:0 16px;border:1px solid rgba(244,241,232,.35);border-radius:10px;padding:12px;font-size:14px;display:flex;justify-content:space-between}
.ask em{font-style:normal;font-weight:900;color:#F2B233}
.map{position:relative;height:470px;margin-top:14px}
.legend{position:absolute;left:16px;bottom:12px;display:flex;gap:10px;font-size:11px}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:4px;vertical-align:middle}
.cmp{padding:0 16px}
.c{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid rgba(244,241,232,.18);opacity:.55}
.c.on{opacity:1}
.c em{font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:13px;border:3px solid #F4F1E8}
.c b{font-size:15px}
.c small{display:block;font-size:12px;opacity:.75}
.c span{font-weight:900;font-size:18px}
</style></head><body>
<div class="head"><b>한바퀴</b><small>국제캠 순환 코스</small></div>
<div class="ask"><span>공강 30분인데 오르막 싫어</span><em>찾기</em></div>
<div class="map">
  <svg viewBox="0 0 390 470" width="390" height="470">
    <path d="M0 80 L390 140 M50 0 L140 470 M0 330 L390 290 M290 0 L330 470" stroke="#1B2B57" stroke-width="10"/>
    <path d="M0 210 L390 230 M200 0 L215 470" stroke="#16244A" stroke-width="5"/>
    <path d="M150 380 L120 330 L170 300 L120 250 L170 210" fill="none" stroke="#2E6BE6" stroke-width="3" opacity=".35"/>
    <path d="M280 380 L255 320 L130 300 L85 220 L145 130 L245 105 L310 170 L300 280 Z" fill="none" stroke="#F4F1E8" stroke-width="3" opacity=".25" transform="translate(0 0)"/>
    <path d="M280 380 L255 320 L130 300" fill="none" stroke="#3CB44A" stroke-width="8" stroke-linecap="round"/>
    <path d="M130 300 L85 220" fill="none" stroke="#F2B233" stroke-width="8" stroke-linecap="round"/>
    <path d="M85 220 L145 130" fill="none" stroke="#E0262A" stroke-width="8" stroke-linecap="round"/>
    <path d="M145 130 L245 105 L310 170 L300 280 L280 380" fill="none" stroke="#3CB44A" stroke-width="8" stroke-linecap="round"/>
    <circle cx="280" cy="380" r="11" fill="#0E1B3D" stroke="#F4F1E8" stroke-width="5"/>
    <text x="298" y="386" fill="#F4F1E8" font-size="13" font-weight="900" font-family="Gothic A1">경희대 정문</text>
    <circle cx="85" cy="220" r="6" fill="#F4F1E8"/><circle cx="145" cy="130" r="6" fill="#F4F1E8"/><circle cx="245" cy="105" r="6" fill="#F4F1E8"/><circle cx="310" cy="170" r="6" fill="#F4F1E8"/>
  </svg>
  <div class="legend"><span><i style="background:#3CB44A"></i>평지</span><span><i style="background:#F2B233"></i>완만</span><span><i style="background:#E0262A"></i>급경사</span></div>
</div>
<div class="cmp">
  <div class="c on"><em>A</em><div><b>정문 순환 A</b><small>35분 · 상승 67m · 최대 8%</small></div><span>5.35</span></div>
  <div class="c"><em>B</em><div><b>정문 순환 B</b><small>32분 · 상승 64m · 최대 9%</small></div><span>4.85</span></div>
  <div class="c"><em>C</em><div><b>정문 순환 C</b><small>30분 · 상승 64m · 최대 11%</small></div><span>4.61</span></div>
</div>
</body></html>
