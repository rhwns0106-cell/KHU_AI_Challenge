<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;900&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;font-family:"Gothic A1",sans-serif;color:#1F2430;
 background:#F6F7F2;background-image:linear-gradient(#DDE3EA 1px,transparent 1px),linear-gradient(90deg,#DDE3EA 1px,transparent 1px);background-size:18px 18px}
.top{padding:18px 16px 10px;display:flex;align-items:baseline;gap:8px}
.top b{font-size:26px;font-weight:900;letter-spacing:-.02em}
.top span{font-family:"Nanum Pen Script";font-size:22px;color:#5A6170}
.ask{margin:0 16px;display:flex;align-items:center;border-bottom:2.5px solid #1F2430;padding:8px 0}
.ask p{flex:1;font-size:16px;font-weight:700}
.ask i{font-style:normal;background:#2B59FF;color:#fff;font-weight:800;font-size:14px;padding:8px 12px;border-radius:6px}
.tapes{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px}
.tape{font-family:"Nanum Pen Script";font-size:21px;padding:2px 10px;background:rgba(255,225,90,.75);transform:rotate(-1.5deg)}
.tape:nth-child(2){background:rgba(123,220,106,.6);transform:rotate(1deg)}
.tape:nth-child(3){background:rgba(91,184,255,.55);transform:rotate(-.5deg)}
.map{position:relative;height:330px;margin:4px 0;border-block:1.5px solid #1F2430;background:#EEF1EA}
.map svg{position:absolute;inset:0}
.sum{padding:12px 16px 6px;display:flex;justify-content:space-between;align-items:baseline}
.sum h2{font-size:20px;font-weight:900}
.sum em{font-style:normal;font-weight:900;font-size:22px}
.sum small{display:block;font-size:13px;color:#5A6170;font-weight:500}
.hl{margin:4px 16px 12px;height:14px;border-radius:7px;display:flex;overflow:hidden;opacity:.9}
.hl i{display:block;height:100%}
.list{margin:0 16px;border-top:1.5px solid #1F2430}
.row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px dashed #9AA3B2}
.box{width:22px;height:22px;border:2.5px solid #1F2430;border-radius:4px;display:grid;place-items:center;font-weight:900;font-size:13px}
.row.on .box{background:#1F2430;color:#F6F7F2}
.row b{font-size:15px;font-weight:800;display:block}
.row small{font-size:12.5px;color:#5A6170}
.row .km{font-size:22px;font-weight:900}
.row:not(.on){opacity:.6}
.ai{margin:12px 16px;font-size:13.5px;line-height:1.55;padding:10px 12px;background:#fff;border:1.5px solid #1F2430;border-radius:8px}
.ai b{background:rgba(255,225,90,.8);padding:0 3px}
</style></head><body>
<div class="top"><b>orca</b><span>오늘의 러닝 노트</span></div>
<div class="ask"><p>공강 30분인데 오르막 싫어, 정문에서 출발</p><i>코스 찾기</i></div>
<div class="tapes"><span class="tape">경희대 정문 출발</span><span class="tape">30분 · 5km</span><span class="tape">평지 위주</span></div>
<div class="map"><svg viewBox="0 0 390 330">
 <g stroke="#C9D0D8" stroke-width="7" fill="none" stroke-linecap="round"><path d="M0 250 L390 210"/><path d="M120 0 L170 330"/><path d="M260 0 L300 330"/><path d="M0 90 L390 120"/></g>
 <path d="M70 60 C120 50 160 90 150 140 S90 220 140 260" stroke="#9AA3B2" stroke-width="2.5" fill="none" stroke-dasharray="5 6"/>
 <g fill="none" stroke-linecap="round" stroke-width="16" opacity=".85">
  <path d="M270 250 L300 190" stroke="#7BDC6A"/><path d="M300 190 C310 150 300 110 270 90" stroke="#FFE15A"/>
  <path d="M270 90 C230 70 190 80 170 110" stroke="#7BDC6A"/><path d="M170 110 C150 150 160 200 190 230" stroke="#5BB8FF"/>
  <path d="M190 230 C220 255 250 262 270 250" stroke="#FF9F45"/></g>
 <path d="M270 250 L300 190 C310 150 300 110 270 90 C230 70 190 80 170 110 C150 150 160 200 190 230 C220 255 250 262 270 250" stroke="#1F2430" stroke-width="2" fill="none"/>
 <g font-family="Gothic A1" font-weight="900" font-size="11" text-anchor="middle">
  <circle cx="303" cy="160" r="12" fill="#fff" stroke="#1F2430" stroke-width="2"/><text x="303" y="164">1</text>
  <circle cx="225" cy="76" r="12" fill="#fff" stroke="#1F2430" stroke-width="2"/><text x="225" y="80">2</text>
  <circle cx="160" cy="170" r="12" fill="#fff" stroke="#1F2430" stroke-width="2"/><text x="160" y="174">3</text>
  <circle cx="230" cy="257" r="12" fill="#fff" stroke="#1F2430" stroke-width="2"/><text x="230" y="261">4</text></g>
 <circle cx="270" cy="250" r="10" fill="#1F2430"/><text x="285" y="278" font-family="Nanum Pen Script" font-size="22">경희대 정문 · 출발/도착</text>
</svg></div>
<div class="sum"><div><h2>A선 · 정문 순환</h2><small>신호 건널목 2곳 · 오르막 +1분 · 공강 30분 중 4분 넘음</small></div><em>34분</em></div>
<div class="hl"><i style="width:46%;background:#7BDC6A"></i><i style="width:20%;background:#FFE15A"></i><i style="width:6%;background:#FF9F45"></i><i style="width:28%;background:#5BB8FF"></i></div>
<div class="list">
 <div class="row on"><span class="box">A</span><span><b>A선 · 정문 순환</b><small>34분 · 신호 2곳 · 상승 63m</small></span><span class="km">4.83</span></div>
 <div class="row"><span class="box">B</span><span><b>B선 · 정문 순환</b><small>37분 · 신호 3곳 · 상승 74m</small></span><span class="km">5.28</span></div>
</div>
<p class="ai"><b>AI</b> 평지 46%예요(초록). <b>2.1km</b>부터 300m 완만한 오르막(+14m)이 있어요.</p>
</body></html>
